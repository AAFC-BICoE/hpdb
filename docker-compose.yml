version: '3'

services:
  db:
    container_name: hpdb-db
    image: mariadb:10.5
    volumes:
      - hpdb-data:/var/lib/mysql
      - ./mysql-dump:/opt/app-root/src
    ports:
      - "3306:3306"
    environment:
      - MYSQL_USER=hpdb_user
      - MYSQL_PASSWORD=hpdbwebaafc1
      - MYSQL_DATABASE=hpdbweb
      - MYSQL_ROOT_PASSWORD=rootpass1
    networks:
      - my-network
  app:
    container_name: hpdb
    image: hpdb:latest
    depends_on:
      - db
    restart: on-failure
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - my-network
      
networks:
  my-network:
    driver: bridge

volumes:
  hpdb-data:
